<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1426"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    
    <!-- Gradiente Ciano Néon -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Efeito de Brilho -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Anel Traçado Externo -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00f0ff" stroke-width="10" stroke-dasharray="35 15" stroke-opacity="0.6" />
  
  <!-- Anel Interno Principal -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#cyanGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Linhas Radiais Tecnológicas -->
  <g stroke="#00f0ff" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="95" x2="256" y2="135" />
    <line x1="256" y1="377" x2="256" y2="417" />
    <line x1="95" y1="256" x2="135" y2="256" />
    <line x1="377" y1="256" x2="417" y2="256" />
    <line x1="142" y1="142" x2="170" y2="170" />
    <line x1="342" y1="342" x2="370" y2="370" />
    <line x1="142" y1="370" x2="170" y2="342" />
    <line x1="342" y1="170" x2="370" y2="142" />
  </g>

  <!-- Núcleo de Energia Central -->
  <circle cx="256" cy="256" r="75" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="35" fill="#ffffff" filter="url(#glow)"/>
</svg>
